<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kuaile Learn</title>
  <meta name="description" content="Kuaile Learn: belajar 1.200 kosakata HSK 1–4.">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kuaile Learn">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1D4ED8; overscroll-behavior: none; }
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { outline: none; }
    #k-splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0B1E5B, #1D4ED8 60%, #3B82F6); color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
      transition: opacity .35s ease; }
    #k-splash.hide { opacity: 0; pointer-events: none; }
    #k-splash img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    #k-splash h1 { font-size: 26px; margin: 18px 0 4px; letter-spacing: .2px; }
    #k-splash p { margin: 0; opacity: .85; font-size: 15px; max-width: 340px; line-height: 1.45; }
    #k-splash .bar { width: 160px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.25); margin-top: 22px; overflow: hidden; }
    #k-splash .bar i { display: block; height: 100%; width: 40%; border-radius: 6px; background: #FBBF24; animation: k-load 1.1s ease-in-out infinite; }
    @keyframes k-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #k-toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 20;
      max-width: min(86vw, 420px); padding: 12px 18px; border-radius: 16px; background: rgba(15,23,42,.92); color: #fff; font-size: 14px;
      line-height: 1.4; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    #k-toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div id="k-splash">
    <img src="icon-192.png" alt="">
    <h1>Kuaile Learn</h1>
    <p id="k-splash-msg">Menyiapkan 1.200 kosakata…</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // Kotlin/Wasm butuh browser baru (iPhone: iOS 18.2 ke atas; Chrome/Edge 119+; Firefox 120+).
    (function () {
      var ok = false;
      try {
        // Uji fitur WebAssembly GC (tipe struct) yang dipakai Kotlin/Wasm.
        ok = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,95,1,127,0]));
      } catch (e) { ok = false; }
      if (!ok) {
        document.getElementById("k-splash-msg").innerHTML =
          "Browser ini belum didukung.<br>Perbarui iPhone ke <b>iOS 18.2</b> atau lebih baru, lalu buka lagi di Safari. Di HP lain, pakai Chrome versi terbaru.";
        document.querySelector("#k-splash .bar").style.display = "none";
        return;
      }
      // Huruf hanzi untuk pengenal tulisan tangan (digambar di kanvas).
      if (window.FontFace && document.fonts) {
        new FontFace("KuaileHanzi", "url(composeResources/com.nesxha.readit.res/font/hanzi_regular.otf)").load()
          .then(function (f) { document.fonts.add(f); }).catch(function () {});
      }
      // Minta penyimpanan permanen supaya progres di browser tidak dihapus otomatis.
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
      var s = document.createElement("script");
      s.src = "kuaile.js";
      s.onerror = function () { document.getElementById("k-splash-msg").textContent = "Gagal memuat aplikasi. Periksa internet lalu muat ulang halaman."; };
      document.body.appendChild(s);
    })();
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
